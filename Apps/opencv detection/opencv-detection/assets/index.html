<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenCV Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>OpenCV Detection</h1>
        <p>Host Debian camera stream</p>
      </div>
      <a id="snapshotLink" target="_blank">Snapshot</a>
    </header>

    <section class="viewer">
      <img id="stream" alt="OpenCV stream">
      <div id="placeholder">Waiting for Debian OpenCV service...</div>
    </section>

    <footer>
      <span id="status">Checking service...</span>
      <span id="streamUrl"></span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
